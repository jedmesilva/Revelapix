openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: revela
    description: Server-owned application state
  - name: auth
    description: Account and session operations
  - name: cells
    description: Cell reveal and redemption operations
  - name: orders
    description: Demonstration Pix orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /revela/state:
    get:
      operationId: getRevelaState
      tags: [revela]
      summary: Read the current application state
      responses:
        "200":
          description: Current state for the active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account and session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "400":
          description: Invalid account data
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Start an account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Invalid credentials
  /auth/google/config:
    get:
      operationId: getGoogleAuthConfig
      tags: [auth]
      summary: Read public Google sign-in configuration
      responses:
        "200":
          description: Public Supabase Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthConfig"
  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [auth]
      summary: Validate a Google identity and create an app session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Invalid or unverified Google identity
        "409":
          description: Google identity conflicts with an existing account
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: End the current account session
      responses:
        "204":
          description: Session ended
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
  /cells/{cellId}/reveal:
    post:
      operationId: revealCell
      tags: [cells]
      summary: Reveal a cell using one chance
      parameters:
        - name: cellId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 83
      responses:
        "200":
          description: Updated state after revealing a cell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "409":
          description: Cell or chance is unavailable
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a demonstration Pix order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "409":
          description: Order or cell is unavailable
  /orders/{orderId}/simulate-payment:
    post:
      operationId: simulateOrderPayment
      tags: [orders]
      summary: Simulate payment for a demonstration order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated state after simulated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "403":
          description: Simulation disabled in production
        "409":
          description: Order is no longer payable
  /redemptions:
    post:
      operationId: redeemCell
      tags: [cells]
      summary: Simulate redemption of an owned cell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCellInput"
      responses:
        "200":
          description: Demonstration redemption recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResult"
        "400":
          description: Invalid Pix key or CPF
        "401":
          description: Session required
        "409":
          description: Cell is not eligible for redemption
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserSummary:
      type: object
      required: [id, name, email, chances, hasPassword]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        chances: { type: integer, minimum: 0 }
        hasPassword: { type: boolean }
    CellState:
      type: object
      required: [id, phase, isMine, redeemed, prizeValueCents, prizeKind, reservedUntil]
      properties:
        id: { type: integer, minimum: 0, maximum: 83 }
        phase: { type: string, enum: [closed, reserved, open] }
        isMine: { type: boolean }
        redeemed: { type: boolean }
        prizeValueCents: { type: [integer, "null"] }
        prizeKind: { type: [string, "null"], enum: [image, stat, icon, null] }
        reservedUntil: { type: [string, "null"], format: date-time }
    Pack:
      type: object
      required: [n, priceCents]
      properties:
        n: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
    ChancePlan:
      type: object
      required: [id, n, priceCents]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        n: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
    PixOrder:
      type: object
      required: [id, pack, cellId, status, payload, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        pack: { $ref: "#/components/schemas/Pack" }
        cellId: { type: [integer, "null"], minimum: 0, maximum: 83 }
        status: { type: string, enum: [pending, paid, expired] }
        payload: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    RevelaStateResponse:
      type: object
      required: [user, cells, packs, order, serverTime, testPaymentsEnabled]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        cells:
          type: array
          items: { $ref: "#/components/schemas/CellState" }
        packs:
          type: array
          items: { $ref: "#/components/schemas/ChancePlan" }
        order:
          oneOf:
            - $ref: "#/components/schemas/PixOrder"
            - type: "null"
        serverTime: { type: string, format: date-time }
        testPaymentsEnabled: { type: boolean }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 6, maxLength: 128 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    GoogleAuthConfig:
      type: object
      required: [enabled, supabaseUrl, supabaseAnonKey]
      properties:
        enabled: { type: boolean }
        supabaseUrl: { type: string }
        supabaseAnonKey: { type: string }
    GoogleAuthInput:
      type: object
      required: [accessToken]
      properties:
        accessToken: { type: string, minLength: 1, maxLength: 8192 }
    ChangePasswordInput:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 6, maxLength: 128 }
    CreateOrderInput:
      type: object
      additionalProperties: false
      required: [packId]
      properties:
        packId: { type: string, minLength: 1, maxLength: 64 }
        cellId: { type: [integer, "null"], minimum: 0, maximum: 83 }
    RedeemCellInput:
      type: object
      required: [cellId, keyType, pixKey, holderCpf]
      properties:
        cellId: { type: integer, minimum: 0, maximum: 83 }
        keyType: { type: string, enum: [cpf, phone, email, evp] }
        pixKey: { type: string, minLength: 1, maxLength: 254 }
        holderCpf: { type: string, minLength: 11, maxLength: 14 }
    RedemptionResult:
      type: object
      required: [amountCents, maskedPixKey, status]
      properties:
        amountCents: { type: integer, minimum: 1 }
        maskedPixKey: { type: string }
        status: { type: string, enum: [simulated] }

