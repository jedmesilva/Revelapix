openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: revela
    description: Server-owned application state
  - name: auth
    description: Account and session operations
  - name: cells
    description: Cell reveal and redemption operations
  - name: orders
    description: Efí Pix orders
  - name: storage
    description: Public images used by catalog items
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve a public catalog image
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative image path inside the public object storage bucket.
      responses:
        "200":
          description: Public image bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /revela/state:
    get:
      operationId: getRevelaState
      tags: [revela]
      summary: Read the current application state
      responses:
        "200":
          description: Current state for the active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
  /revela/cells:
    get:
      operationId: getRevelaCells
      tags: [revela]
      summary: Read a bounded window of cells
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [all, mine], default: all }
        - name: start
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 999999, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
      responses:
        "200":
          description: A bounded range of cells
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaCellsResponse"
        "400":
          description: Invalid cell window
        "401":
          description: Session required for the personal cell view
        "503":
          description: The cell board is not fully seeded
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account and session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "400":
          description: Invalid account data
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Start an account session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Invalid credentials
  /auth/google:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Start server-managed Google sign-in
      responses:
        "302":
          description: Redirect to Supabase Auth
  /auth/google/callback:
    get:
      operationId: completeGoogleAuth
      tags: [auth]
      summary: Complete Google sign-in on the server
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        "303":
          description: Redirect back to the application after sign-in
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: End the current account session
      responses:
        "204":
          description: Session ended
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
  /cells/{cellId}/reveal:
    post:
      operationId: revealCell
      tags: [cells]
      summary: Reveal a cell using one chance
      parameters:
        - name: cellId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 999999
      responses:
        "200":
          description: Updated state after revealing a cell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "409":
          description: Cell or chance is unavailable
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an Efí Pix order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "409":
          description: Order or cell is unavailable
        "503":
          description: Efí Pix is not configured
        "502":
          description: Efí Pix could not create the charge
  /orders/{orderId}/refresh:
    post:
      operationId: refreshOrderPayment
      tags: [orders]
      summary: Refresh an order using Efí's verified payment status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current state after checking the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "404":
          description: Order does not belong to the current account
        "503":
          description: Provider status is temporarily unavailable
  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrderPayment
      tags: [orders]
      summary: Cancel a pending Efí Pix order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current state after verifying the cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "404":
          description: Order does not belong to the current account
        "409":
          description: Pix code is not ready to cancel
        "503":
          description: Provider could not confirm cancellation
  /orders/{orderId}/simulate-payment:
    post:
      operationId: simulateOrderPayment
      tags: [orders]
      summary: Simulate payment for a demonstration order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated state after simulated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevelaStateResponse"
        "401":
          description: Session required
        "403":
          description: Simulation disabled in production
        "409":
          description: Order is no longer payable
  /redemptions:
    post:
      operationId: redeemCell
      tags: [cells]
      summary: Create a redemption request for an owned cell
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemCellInput"
      responses:
        "201":
          description: Redemption request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResult"
        "400":
          description: Invalid Pix key or CPF
        "401":
          description: Session required
        "409":
          description: Cell is not eligible for redemption
  /cells/{cellId}/redemptions/cancel:
    post:
      operationId: cancelCellRedemption
      tags: [cells]
      summary: Cancel an eligible redemption request owned by the current user
      parameters:
        - name: cellId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 999999
      responses:
        "200":
          description: Redemption request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRedemptionResponse"
        "401":
          description: Session required
        "409":
          description: Redemption is no longer cancellable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserSummary:
      type: object
      required: [id, name, email, chances, hasPassword]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        chances: { type: integer, minimum: 0 }
        hasPassword: { type: boolean }
    CellItem:
      type: object
      required: [id, type, name, valueCents, imageUrl]
      properties:
        id: { type: integer, minimum: 1 }
        type: { type: string, enum: [pix, image] }
        name: { type: string }
        valueCents: { type: [integer, "null"] }
        imageUrl: { type: [string, "null"] }
    CellState:
      type: object
      required: [id, phase, isMine, redeemed, redemptionStatus, item, reservedUntil]
      properties:
        id: { type: integer, minimum: 0, maximum: 999999 }
        phase: { type: string, enum: [closed, reserved, open] }
        isMine: { type: boolean }
        redeemed: { type: boolean }
        redemptionStatus:
          type: [string, "null"]
          enum: [requested, under_review, approved, rejected, cancelled, processing, redeemed, null]
        item:
          oneOf:
            - $ref: "#/components/schemas/CellItem"
            - type: "null"
        reservedUntil: { type: [string, "null"], format: date-time }
    RevelaCellsResponse:
      type: object
      required: [start, total, cells]
      properties:
        start: { type: integer, minimum: 0, maximum: 999999 }
        total: { type: integer, minimum: 0, maximum: 1000000 }
        cells:
          type: array
          items: { $ref: "#/components/schemas/CellState" }
    Pack:
      type: object
      required: [n, priceCents]
      properties:
        n: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
    ChancePlan:
      type: object
      required: [id, n, priceCents]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        n: { type: integer, minimum: 1 }
        priceCents: { type: integer, minimum: 1 }
    PixOrder:
      type: object
      required: [id, pack, cellId, status, payload, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        pack: { $ref: "#/components/schemas/Pack" }
        cellId: { type: [integer, "null"], minimum: 0, maximum: 999999 }
        status: { type: string, enum: [pending, paid, expired] }
        payload: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    RevelaStateResponse:
      type: object
      required: [user, cellCount, myCellCount, packs, order, serverTime, testPaymentsEnabled]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/UserSummary"
            - type: "null"
        cellCount: { type: integer, minimum: 1, maximum: 1000000 }
        myCellCount: { type: integer, minimum: 0, maximum: 1000000 }
        packs:
          type: array
          items: { $ref: "#/components/schemas/ChancePlan" }
        order:
          oneOf:
            - $ref: "#/components/schemas/PixOrder"
            - type: "null"
        serverTime: { type: string, format: date-time }
        testPaymentsEnabled: { type: boolean }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 6, maxLength: 128 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ChangePasswordInput:
      type: object
      required: [newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 6, maxLength: 128 }
    CreateOrderInput:
      type: object
      additionalProperties: false
      required: [packId]
      properties:
        packId: { type: string, minLength: 1, maxLength: 64 }
        cellId: { type: [integer, "null"], minimum: 0, maximum: 999999 }
    RedeemCellInput:
      type: object
      required: [cellId, keyType, pixKey, holderCpf]
      properties:
        cellId: { type: integer, minimum: 0, maximum: 999999 }
        keyType: { type: string, enum: [cpf, phone, email, evp] }
        pixKey: { type: string, minLength: 1, maxLength: 254 }
        holderCpf: { type: string, minLength: 11, maxLength: 14 }
    RedemptionResult:
      type: object
      required: [requestId, amountCents, maskedPixKey, status]
      properties:
        requestId: { type: string, format: uuid }
        amountCents: { type: integer, minimum: 1 }
        maskedPixKey: { type: string }
        status: { type: string, enum: [requested, under_review, approved, rejected, cancelled, processing, redeemed] }
    CancelRedemptionResponse:
      type: object
      required: [requestId, status]
      properties:
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [cancelled] }

